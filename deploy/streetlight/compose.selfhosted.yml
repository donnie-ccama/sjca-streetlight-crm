name: streetlight-crm

# Single-host deployment with local PostgreSQL, Redis, and file storage.
# Run with: docker compose --env-file selfhosted.env -f compose.selfhosted.yml up -d
# See docs/streetlight/SELF_HOSTED.md.

x-streetlight-app: &streetlight-app
  image: ${STREETLIGHT_IMAGE:?Set STREETLIGHT_IMAGE to an immutable image tag or digest}
  env_file:
    - ${STREETLIGHT_ENV_FILE:-selfhosted.env}
  environment: &streetlight-app-environment
    PG_DATABASE_URL: postgres://streetlight:${PG_DATABASE_PASSWORD:?Set PG_DATABASE_PASSWORD}@db:5432/streetlight
    REDIS_URL: redis://redis:6379
  volumes:
    - streetlight-local-storage:/app/packages/twenty-server/.local-storage
  restart: unless-stopped

services:
  server:
    <<: *streetlight-app
    environment:
      <<: *streetlight-app-environment
      NODE_PORT: 3000
      DISABLE_DB_MIGRATIONS: "false"
      DISABLE_CRON_JOBS_REGISTRATION: "false"
    # Loopback only: Docker-published ports bypass the host firewall.
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:3000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 30
      # First boot initializes the database before the server listens.
      start_period: 10m

  worker:
    <<: *streetlight-app
    command: ["yarn", "worker:prod"]
    environment:
      <<: *streetlight-app-environment
      DISABLE_DB_MIGRATIONS: "true"
      DISABLE_CRON_JOBS_REGISTRATION: "true"
    depends_on:
      server:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: streetlight
      POSTGRES_PASSWORD: ${PG_DATABASE_PASSWORD:?Set PG_DATABASE_PASSWORD}
      POSTGRES_DB: streetlight
    volumes:
      - streetlight-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streetlight -d streetlight"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory-policy", "noeviction", "--appendonly", "yes"]
    volumes:
      - streetlight-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  streetlight-db:
  streetlight-redis:
  streetlight-local-storage:
